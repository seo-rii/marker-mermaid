[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "marker-mermaid"
version = "0.1.0"
description = "Evidence-aware Mermaid reconstruction for Marker PDF"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["marker-pdf", "mermaid", "diagram", "pdf", "ocr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: Documentation",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "Pillow>=10.0",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
marker = ["marker-pdf==2.0.0", "PyMuPDF>=1.24,<2"]
vision = ["numpy>=1.26", "opencv-python-headless>=4.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
marker-mermaid = "marker_mermaid.cli:main"

[project.urls]
Homepage = "https://github.com/seo-rii/marker-mermaid"
Repository = "https://github.com/seo-rii/marker-mermaid.git"
Issues = "https://github.com/seo-rii/marker-mermaid/issues"
Documentation = "https://github.com/seo-rii/marker-mermaid/tree/main/docs"
Changelog = "https://github.com/seo-rii/marker-mermaid/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/marker_mermaid"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: exercises Marker or a real Mermaid browser runtime",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
