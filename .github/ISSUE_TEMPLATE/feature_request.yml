name: Feature request
description: Propose a focused improvement or reconstruction contract.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case is blocked, and why do current serializers or fallbacks not address it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired IR, output, fallback, and user-visible behavior.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and validation
      description: Explain available fixtures, provenance, semantic checks, and real Mermaid validation.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: boundaries
    attributes:
      label: Publication boundaries
      options:
        - label: The proposal preserves the original image and does not bypass security or render validation.
          required: true
        - label: Any example data is synthetic or safe to redistribute.
          required: true
